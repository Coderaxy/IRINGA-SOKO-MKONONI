<!DOCTYPE html><html lang="sw"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Usafirishaji – Iringa Soko Mkononi</title><link rel="stylesheet" href="../css/style.css"></head>
<body data-root="../" data-page="tracking"><main class="wrap page-narrow"><div class="head"><h1>Usafirishaji na ufuatiliaji</h1><p>Hifadhi taarifa za delivery address na tracking number ya mzigo.</p></div>
<form id="tf" class="card pd"><label>Tracking number<input name="tracking" required placeholder="Mf. ISM-2026-0001"></label>
<label>Anuani ya kupokea mzigo (Delivery address)<textarea name="address" rows="3" required placeholder="Mtaa, kata, wilaya, mkoa"></textarea></label>
<label>Namba ya simu ya mpokeaji<input name="phone" type="tel" required placeholder="2557xxxxxxxx"></label>
<button class="btn b1" type="submit">Hifadhi taarifa</button></form>
<div class="notice">Hali ya usafirishaji hapa ni rekodi ya ndani tu. Live tracking, courier updates na notifications vitahitaji API/akaunti ya kampuni ya usafirishaji.</div>
<h2 class="section-title">Rekodi zilizohifadhiwa kwenye kifaa hiki</h2><div id="trackResult" class="stack"></div></main><script src="../js/app.js"></script></body></html>
